name: Update Family Wishlist
run-name: ${{ inputs.automatic && format('Automatic release check {0}', inputs.scheduled_time) || 'Manual update' }}

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: 'Automatic timer check (leave unchecked for a manual update)'
        type: boolean
        default: false
      scheduled_time:
        description: 'Cloudflare timer time (leave empty for a manual update)'
        type: string
        default: ''

permissions:
  contents: write
  checks: read
  statuses: read

concurrency:
  group: household-updates
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository != 'JonReed/cloudflare-family-wishlist' &&
      (!inputs.automatic || vars.WISHLIST_AUTO_UPDATE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Get the next tested release
        id: update
        env:
          WISHLIST_AUTOMATIC_CHECK: ${{ inputs.automatic }}
        run: node scripts/update-fork.ts --apply
      - name: Check the Cloudflare build
        if: steps.update.outputs.deployment_commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_COMMIT: ${{ steps.update.outputs.deployment_commit }}
        run: node scripts/verify-update-build.ts
